<section class="bg-black/70 fixed inset-0 z-50 flex justify-center items-center transition-opacity duration-300 py-20 px-5 lg:px-20">

  <div class="bg-white grid lg:grid-cols-2 h-full rounded-md shadow-xl ">

    <!-- <div class="grid grid-cols-2 "> -->
      
      <div class="flex  h-full">
        <img src="habitacion.webp" alt="" class="object-cover h-full rounded-t-md
      lg:rounded-t-md lg:rounded-bl-md lg:rounded-tr-none">
      </div>
      <form [formGroup]="formulario" (ngSubmit)="enviarFormulario()" class="flex flex-col">
        <div class=" w-full flex justify-between py-2 px-5 rounded-t-md  border-amber-500 border-b">
          <h1 class="flex justify-center items-center ">Reservación</h1>
          <a 
          routerLink="/reservas"
          class="flex justify-center items-center lg:items-end h-full font-light underline hover:text-cyan-700 cursor-pointer">Más info</a>
          <!-- <a class="flex text-end justify-center bg-amber-300" >Más info</a> -->
        </div>
        <div class="flex flex-col justify-between h-full p-5">

          <div class="flex flex-col">
            <label for="fecha">Fecha de reserva</label>
            <input type="date" id="fecha" formControlName="fecha" class="style-input" />
            @if (f['fecha'].errors?.['required'] && (f['fecha'].touched || submitted)) {
              <small class="text-red-600">Seleccione la fecha</small>
            }
          </div>
          <div class="flex flex-col">
            <label for="noches">Noches</label>
            <input type="number" id="noches" formControlName="noches" class="style-input" />
            @if (f['noches'].errors?.['required'] && (f['noches'].touched || submitted)) {
              <small class="text-red-600">Ingrese la cantidad de noches</small>
            }
          </div>
          <div class="flex w-full gap-5">
            <button type="button" (click)="modalService.close()"
            class="bg-amber-500 text-white font-semibold w-1/2 py-1 px-2 rounded-md">Cancelar</button>
            <button type="submit" class="bg-cyan-800 w-1/2 text-white font-semibold py-1 px-2 rounded-md">Confirmar</button>
          </div>
        </div>
      </form>
    <!-- </div> -->
    <!-- <div class="h-8 items-center rounded-b-md flex justify-center w-full "></div> -->
  </div>
</section>
